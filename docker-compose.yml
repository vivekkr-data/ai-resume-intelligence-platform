services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: resume_analyzer
      POSTGRES_USER: resume_user
      POSTGRES_PASSWORD: resume_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resume_user -d resume_analyzer"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg://resume_user:resume_password@postgres:5432/resume_analyzer
      APP_ENV: docker
      STORE_PII: "false"
      ADMIN_API_KEY: local-docker-admin-key
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: .
    command: streamlit run streamlit_app.py --server.address=0.0.0.0 --server.port=8501
    environment:
      DATABASE_URL: postgresql+psycopg://resume_user:resume_password@postgres:5432/resume_analyzer
      APP_ENV: docker
      STORE_PII: "false"
      ADMIN_DASHBOARD_PIN: "1234"
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
